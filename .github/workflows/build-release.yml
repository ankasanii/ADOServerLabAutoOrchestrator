name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test Windows package
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      docs_only: ${{ steps.changes.outputs.docs_only }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Markdown-only changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $base = $env:BEFORE_SHA
          $head = $env:HEAD_SHA
          $separator = '..'
          if ($env:EVENT_NAME -eq 'pull_request') {
            $base = $env:PR_BASE_SHA
            $head = $env:PR_HEAD_SHA
            $separator = '...'
          }
          elseif ($env:EVENT_NAME -ne 'push') { throw 'Unsupported event for change detection.' }
          if ($base -notmatch '^[0-9a-f]{40}$' -or $head -notmatch '^[0-9a-f]{40}$') {
            throw 'Missing or invalid commit IDs for change detection.'
          }
          $docsOnly = $false
          if ($base -match '^0+$') {
            Write-Host 'Initial push: running full validation.'
          }
          else {
            $files = @(git diff --no-renames --name-only "$base$separator$head" --)
            if ($LASTEXITCODE -ne 0) { throw 'Could not determine changed files.' }
            $docsOnly = $files.Count -gt 0 -and @($files | Where-Object { $_ -notmatch '\.md$' }).Count -eq 0
          }
          "docs_only=$($docsOnly.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $summary = if ($docsOnly) { 'Markdown-only changes: running lint; build, tests, ZIP upload, and release are skipped.' }
              else { 'Running full lint, build, and test validation.' }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Lint workflows and PowerShell
        run: .\.github\Test-Lint.ps1

      - name: Run offline guest tests
        if: steps.changes.outputs.docs_only == 'false'
        run: .\GuestSetup\Setup-Server.ps1 -ValidateOnly

      - name: Determine build version
        if: steps.changes.outputs.docs_only == 'false'
        id: version
        env:
          BUILD_RUN_NUMBER: ${{ github.run_number }}
        run: |
          $version = [DateTime]::UtcNow.ToString('yyyy.MM.dd') + '.' + $env:BUILD_RUN_NUMBER
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build UI, ZIP, and checksum
        if: steps.changes.outputs.docs_only == 'false'
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: .\SetupUI\Build-SetupUI.ps1 -Version $env:BUILD_VERSION

      - name: Test UI in Windows PowerShell 5.1 STA
        if: steps.changes.outputs.docs_only == 'false'
        env:
          EXPECTED_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          powershell.exe -NoProfile -NonInteractive -STA -File .\SetupUI\Test-SetupUI.ps1 -ExpectedVersion $env:EXPECTED_BUILD_VERSION
          if ($LASTEXITCODE -ne 0) { throw "UI tests failed: $LASTEXITCODE" }

      - name: Upload tested ZIP
        if: steps.changes.outputs.docs_only == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: AdoServerLabAutoOrchestrator
          path: |
            SetupUI\AdoServerLabAutoOrchestrator.zip
            SetupUI\AdoServerLabAutoOrchestrator.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.docs_only == 'false'
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested ZIP
        uses: actions/download-artifact@v4
        with:
          name: AdoServerLabAutoOrchestrator

      - name: Create release and attach ZIP
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: main-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $archive = '.\AdoServerLabAutoOrchestrator.zip'
          $checksum = (Get-Content -LiteralPath "$archive.sha256" -Raw).Trim()
          if ($checksum -notmatch '^([0-9a-f]{64})  AdoServerLabAutoOrchestrator\.zip$') { throw 'Invalid checksum file format.' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $Matches[1]) { throw 'Release ZIP checksum mismatch.' }
          $releaseTitle = "AdoServerLabAutoOrchestrator-$env:RELEASE_VERSION"
          $notes = "Automated lab build from commit $env:RELEASE_COMMIT. Extract the whole AdoServerLabAutoOrchestrator.zip before running AdoServerLabAutoOrchestrator.exe. The application is unsigned; review the repository documentation and distribution requirements before use."
          gh release create "$env:RELEASE_TAG" "$archive" "$archive.sha256" --repo "$env:GH_REPO" --target "$env:RELEASE_COMMIT" --title "$releaseTitle" --notes "$notes" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed: $LASTEXITCODE" }
