name: Check download URLs

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-download-urls.yml'
      - 'Test-DownloadUrls.ps1'
      - 'Test-DownloadUrls.Offline.ps1'
      - 'GuestSetup/Setup-Releases.psm1'
      - 'GuestSetup/Resume-Setup.ps1'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/check-download-urls.yml'
      - 'Test-DownloadUrls.ps1'
      - 'Test-DownloadUrls.Offline.ps1'
      - 'GuestSetup/Setup-Releases.psm1'
      - 'GuestSetup/Resume-Setup.ps1'

permissions:
  contents: read

jobs:
  check-download-urls:
    name: Verify configured installer links
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test checker offline
        run: .\Test-DownloadUrls.Offline.ps1

      - name: Check download URLs online
        run: |
          powershell.exe -NoProfile -NonInteractive -File .\Test-DownloadUrls.ps1 -ReportPath .\download-links.csv
          $checkExitCode = $LASTEXITCODE
          if ($checkExitCode -eq 1) {
            Write-Host '::warning::Some download URLs are unavailable. Review the download-url-report CSV artifact and check logs.'
            'Warning: some download URLs are unavailable. See the download-url-report CSV artifact for details.' |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          elseif ($checkExitCode -ne 0) { throw "Download URL checker failed to execute correctly (exit $checkExitCode)." }
          exit 0

      - name: Upload URL check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: download-url-report
          path: download-links.csv
          if-no-files-found: error
          retention-days: 14
